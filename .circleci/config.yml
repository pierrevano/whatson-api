version: 2.1

parameters:
  run:
    type: boolean
    default: false
  force:
    type: boolean
    default: false
  item_type:
    type: enum
    enum: ["", "movie", "tvshow"]
    default: ""
  batch:
    type: integer
    default: 0

commands:
  ping_service:
    steps:
      - run:
          name: Ping service
          command: |
            if [[ -z "$WHATSON_API_URL" ]]; then
              echo "Error: WHATSON_API_URL environment variable is not set."
              exit 1
            fi

            echo "Calling: $WHATSON_API_URL"

            if ! curl -sf "$WHATSON_API_URL" > /dev/null; then
              echo "Error: Failed to reach $WHATSON_API_URL"
              exit 1
            fi

            echo "Service ping successful."
  setup_env:
    steps:
      - checkout
      - run:
          name: Install npm globally
          command: sudo npm install -g npm@10.9.8
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Install Playwright browsers + deps
          command: npx playwright install --with-deps chromium
      - run:
          name: Install vercel globally
          command: sudo npm install -g vercel
  run_tests:
    steps:
      - run:
          name: Run tests
          command: npm run test-remote
          environment:
            JEST_JUNIT_OUTPUT_DIR: ./reports/
            JEST_JUNIT_ADD_FILE_ATTRIBUTE: "true"
      - store_test_results:
          path: ./reports/
  update_data:
    parameters:
      step_name:
        type: string
      args:
        type: string
      step_batch:
        type: integer
        default: 0
    steps:
      - run:
          name: << parameters.step_name >>
          command: |
            set -- << parameters.args >>
            item_type="<< pipeline.parameters.item_type >>"
            batch="<< pipeline.parameters.batch >>"

            if [[ -n "$item_type" && "$item_type" != "$1" ]]; then
              echo "Skipping $1 because item_type is set to $item_type."
              exit 0
            fi

            if [[ "$batch" != "0" && "$batch" != "<< parameters.step_batch >>" ]]; then
              echo "Skipping $1 because batch is set to $batch."
              exit 0
            fi

            node src/data/updateData.js "$@"

jobs:
  build:
    docker:
      - image: cimg/node:22.22.3
    environment:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - ping_service
      - setup_env
      - update_data:
          step_name: Update movie data
          args: movie update_ids update_db
      - update_data:
          step_name: Update tvshow data first batch
          args: tvshow update_ids update_db circleci active no_check_db_ids 0 no_force mojo no_skip_services no_delete_ids 0 101
          step_batch: 1
      - update_data:
          step_name: Update tvshow data second batch
          args: tvshow no_update_ids update_db circleci active no_check_db_ids 100 no_force mojo no_skip_services no_delete_ids 0 201
          step_batch: 2
      - update_data:
          step_name: Update tvshow data third batch
          args: tvshow no_update_ids update_db circleci active no_check_db_ids 200 no_force mojo no_skip_services no_delete_ids 0 301
          step_batch: 3
      - run_tests
  force:
    docker:
      - image: cimg/node:22.22.3
    environment:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - ping_service
      - setup_env
      - update_data:
          step_name: Force update movie data
          args: movie update_ids update_db circleci active no_check_db_ids 0 force
      - update_data:
          step_name: Force update tvshow data first batch
          args: tvshow update_ids update_db circleci active no_check_db_ids 0 force mojo no_skip_services no_delete_ids 0 101
          step_batch: 1
      - update_data:
          step_name: Force update tvshow data second batch
          args: tvshow no_update_ids update_db circleci active no_check_db_ids 100 force mojo no_skip_services no_delete_ids 0 201
          step_batch: 2
      - update_data:
          step_name: Force update tvshow data third batch
          args: tvshow no_update_ids update_db circleci active no_check_db_ids 200 force mojo no_skip_services no_delete_ids 0 301
          step_batch: 3
      - run_tests

workflows:
  build:
    when: << pipeline.parameters.run >>
    jobs:
      - build
  force:
    when: << pipeline.parameters.force >>
    jobs:
      - force
